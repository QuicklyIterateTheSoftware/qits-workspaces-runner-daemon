# workspaces-runner — the pull-based node a person installs on any Linux host with docker, so that
# host runs qits workspaces.
#
# NOTHING OF THE RUNNER IS CONFIGURED HERE. Its environment is read by qits-runner-toolkit's
# RunnerSettings, under the identity's prefix, and never through SmallRye: QITS_WORKSPACES_RUNNER_URL,
# _ID, _REGISTRATION_TOKEN (until registered), _SLOTS, _STATE_DIR, _DOCKER_BINARY, _DOCKER_TIMEOUT,
# _ROLLOVER_TIMEOUT, _SELF_UPDATE and _TELEMETRY_URL — see the README's "Environment". A binary
# started with none of them exits 2 with one sentence naming what is missing.
#
# `qits-workspaces-runner health` (the healthcheck), QITS_WORKSPACES_RUNNER_PRINT_VERSION=1 (the
# image's smoke probe) and QITS_WORKSPACES_RUNNER_DECOMMISSION=<id> (the decommission helper) are
# answered by Main before Quarkus starts.

# Name the compiled artifact `qits-workspaces-runner`: the image puts it at
# /usr/local/bin/qits-workspaces-runner and makes it the entrypoint, so it is what `ps` shows.
quarkus.package.output-name=qits-workspaces-runner
quarkus.package.jar.add-runner-suffix=false

# Lean and quiet: the container's log IS the operator's view of this process (`docker logs -f
# qits-workspaces-runner-…`), so what is logged matters and a banner is noise in it.
quarkus.log.level=INFO
quarkus.banner.enabled=false

# The runner dials https (the register door, the token endpoint, the registry) and wss (the socket)
# through the platform's edge, so the native image must carry TLS. Explicit rather than left to an
# extension's opinion: without it a native build can link no SSL at all and the first dial fails at
# runtime.
quarkus.ssl.native=true

# --- the shipping form: a fully static musl native image -------------------------------------------
# qits-ci-runner-daemon's settings, unchanged, and each line load-bearing for the reasons its
# application.properties gives: the musl toolchain lives only in the builder image; that image is
# local-only (hence pull=missing); and --static --libc=musl is the point, because a runner host is
# whatever Linux a person had.
quarkus.native.container-build=true
quarkus.native.builder-image=qits/graalvmce-musl-builder:jdk-25
quarkus.native.builder-image.pull=missing
quarkus.native.additional-build-args=--static,--libc=musl
