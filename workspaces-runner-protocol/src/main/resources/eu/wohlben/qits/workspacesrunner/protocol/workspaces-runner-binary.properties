# Filtered at build time — see workspaces-runner-protocol/pom.xml's <resources> block and
# WorkspacesRunnerBinary's javadoc. The value is this reactor's ${project.version}, which the release
# flow stamps with the version it is about to tag and publish the image under, so the jar's version
# and the image's tag are one string by construction rather than two edits somebody has to keep
# matched.
#
# Do NOT write a literal here. RunnerBinaryVersion refuses a value that still starts with `$`, which
# is what an unfiltered copy of this file looks like.
version=${project.version}
